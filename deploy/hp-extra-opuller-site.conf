# OPuller on srv2: the vhost there is generated by the home panel (hp-site) and includes
# /etc/nginx/hp-extra/opuller/*.conf inside its server block — this file is that include
# (installed as /etc/nginx/hp-extra/opuller/10-site.conf) and the only thing the site adds
# to the panel's config. Standalone equivalent: deploy/nginx-opuller.conf.
#
# The panel's snippet hp-ssl.conf already adds HSTS, nosniff and Referrer-Policy at server
# level; the three headers below join them for every response. Locations that add a header
# of their own lose the inherited set, so they include the full snippet
# (deploy/nginx-opuller-headers.conf → /etc/nginx/snippets/opuller-headers.conf).
# gzip is scoped to the site's own locations so the VPN and subscription paths that share
# this vhost (/assets/v3/...) are not touched; those are longer prefixes and keep winning.

add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# the editor (also the target of the SPA fallback: try_files ... /index.html re-enters here)
location = /index.html {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# static site pages
location ^~ /features/ {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
location ^~ /guide/ {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
location ^~ /ai/ {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

# hashed build assets: a year, compressed (the main chunk is 1.3 MB of JavaScript)
location ^~ /assets/ {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    gzip_types text/css application/javascript image/svg+xml application/wasm;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    try_files $uri =404;
}

# the pages' stylesheet is replaced in place: revalidate instead of the panel's 30-day expiry
location = /site.css {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# the PWA manifest is missing from the stock mime.types
location = /manifest.webmanifest {
    include snippets/opuller-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    default_type application/manifest+json;
}
