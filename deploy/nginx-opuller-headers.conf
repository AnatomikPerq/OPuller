# Security headers for the OPuller site — /etc/nginx/snippets/opuller-headers.conf.
# Included from every location of deploy/nginx-opuller.conf (nginx does not inherit
# add_header into a location that sets its own). `vite preview` reads the CSP from here.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: scripts only from the site itself (no inline scripts; wasm for pdf.js decoders), inline styles
# (React sets style attributes; SVG markup carries them), images/fonts inline or same-origin
# (external https images come from imported SVGs), the loopback AI bridge, same-origin workers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: blob:; connect-src 'self' data: blob: ws://127.0.0.1:5187 ws://localhost:5187; worker-src 'self' blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'" always;
