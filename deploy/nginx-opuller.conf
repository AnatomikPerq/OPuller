# nginx server block for the OPuller production site (opuller.huhusova67.online).
#
# The site is a static Vite build (dist/) — no server-side code. Deploy = `npm run build`,
# then copy dist/ into the web root (index.html, assets/, the icons, manifest, robots.txt,
# sitemap.xml, og.png, screenshot.png, site.css, features/, guide/, ai/). Do not wipe the
# web root: the same vhost can carry unrelated files (e.g. /assets/v3/).
#
# Headers live in the snippet deploy/nginx-opuller-headers.conf because nginx drops every
# inherited add_header as soon as a location adds one of its own — it is included in each location.
#
# `vite preview` (npm run preview) applies the Content-Security-Policy from that snippet so the
# policy can be checked locally before it reaches the server (see vite.config.ts).

# ---- shared headers: deploy/nginx-opuller-headers.conf → /etc/nginx/snippets/opuller-headers.conf ----

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opuller.huhusova67.online;

    # ssl_certificate     /etc/letsencrypt/live/opuller.huhusova67.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/opuller.huhusova67.online/privkey.pem;

    root /srv/sites/opuller;
    index index.html;
    charset utf-8;

    # the JS bundle is ~3.4 MB uncompressed: compress text assets (or pre-compress with brotli)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json application/wasm;

    # the PWA manifest is not in the stock mime.types (would be served as octet-stream)
    location = /manifest.webmanifest {
        include snippets/opuller-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # hashed build assets: cache for a year (^~ keeps the regex location below away from /assets/)
    location ^~ /assets/ {
        include snippets/opuller-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # icons, images, manifest, robots, sitemap, site.css: cache for a day (they are replaced in place)
    location ~* \.(png|ico|svg|webp|jpg|jpeg|xml|txt|css)$ {
        include snippets/opuller-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so a deploy is visible at once
    location / {
        include snippets/opuller-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name opuller.huhusova67.online;
    return 301 https://$host$request_uri;
}
