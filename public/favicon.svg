<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- OPuller mark: a Bézier curve with anchor handles on a burgundy tile (no fonts, so it renders identically everywhere) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a2a4e"/>
      <stop offset="1" stop-color="#561026"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <!-- handle lines -->
  <path d="M14 46 L24 22 M50 18 L40 42" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the curve -->
  <path d="M14 46 C24 22 40 42 50 18" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <!-- anchors (squares) and handle knobs (circles) -->
  <rect x="9.5" y="41.5" width="9" height="9" rx="1.5" fill="#ffffff"/>
  <rect x="45.5" y="13.5" width="9" height="9" rx="1.5" fill="#ffffff"/>
  <circle cx="24" cy="22" r="3.6" fill="#ffd166"/>
  <circle cx="40" cy="42" r="3.6" fill="#ffd166"/>
</svg>
